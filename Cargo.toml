[package]
name = "dolgorae"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
build = "build.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
data-encoding = "2.9"
libc = "0.2"
prost = "=0.14.4"
prost-types = "=0.14.4"
tonic = "=0.14.3"
tonic-prost = "=0.14.3"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "sync", "signal", "time", "macros"] }
tokio-stream = { version = "=0.1.18", features = ["net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
sha1 = "0.10"
toml = "0.9"
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[build-dependencies]
tonic-prost-build = { version = "=0.14.3", default-features = false, features = ["transport"] }

[dev-dependencies]
hyper-util = { version = "=0.1.20", features = ["tokio"] }
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
