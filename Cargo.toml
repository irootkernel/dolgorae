[workspace]
resolver = "3"
members = [
    "crates/dolgorae-spi",
    "crates/dolgorae-core",
    "crates/dolgorae-api",
    "crates/dolgorae-mcp",
    "crates/dolgorae-cli",
    "crates/drivers/driver-codex-app",
    "crates/drivers/driver-claude-wire",
    "crates/drivers/driver-agy-acp",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.5.58", features = ["derive"] }
futures-core = "0.3.34"
futures-util = "0.3.34"
http = "1.4.2"
http-body-util = "0.1.3"
hyper = "1.10.1"
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2.190"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "signal", "time", "macros", "process", "io-util"] }
tokio-stream = { version = "0.1.18", features = ["net", "sync"] }
tokio-util = "0.7.18"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v7", "serde"] }
zeroize = "1.9.0"

dolgorae-spi = { path = "crates/dolgorae-spi" }
dolgorae-core = { path = "crates/dolgorae-core" }
dolgorae-api = { path = "crates/dolgorae-api" }
dolgorae-mcp = { path = "crates/dolgorae-mcp" }
driver-codex-app = { path = "crates/drivers/driver-codex-app" }
driver-claude-wire = { path = "crates/drivers/driver-claude-wire" }
driver-agy-acp = { path = "crates/drivers/driver-agy-acp" }

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
