schema: podway.procedure/v2
id: aquarium-goal-v2
version: "6"
name: Aquarium Goal
purpose: Deliver one epic member, remediation, or closeout goal with current evidence.
description: A flexible goal-centered Podway procedure for epic-handler work.
goal_tracking: true
node_definitions:
  work-record:
    type: action
    title: Complete the goal work
    intent: Record the bounded implementation, investigation, documentation, and lifecycle work.
    items:
      - id: work-summary
        type: text
        prompt: Record the completed goal work and task-owned boundary.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
      - id: source-revision
        type: text
        prompt: Record HEAD and the goal-owned dirty-tree identity.
        required: true
        min_length: 1
        max_length: 512
        multiline: true
      - id: plan-handoff-artifact
        type: artifact
        prompt: Attach the approved Markdown epic plan only for an explicit plan handoff.
        required: false
        allowed_media_types:
          - text/markdown
  evidence-record:
    type: action
    title: Record verification and review
    intent: Record current checks and complete Mulgae evidence for this goal.
    items:
      - id: review-mode
        type: choice
        prompt: Record the applicable member-goal review mode, or the final epic closeout exception after successful validation.
        required: true
        choices:
          - remediation-eligible
          - hardening-deferral-eligible
          - closeout-not-required
      - id: review-round
        type: integer
        prompt: Record the positive ordinal of this operationally complete Mulgae root review for the current goal revision.
        required: false
        required_when:
          - item: review-mode
            not_equals: closeout-not-required
        minimum: 1
      - id: review-run-id
        type: text
        prompt: Record the exact committed Mulgae root review run ID.
        required: false
        required_when:
          - item: review-mode
            not_equals: closeout-not-required
        min_length: 1
        max_length: 128
        multiline: true
      - id: evidence-summary
        type: text
        prompt: Record commands, exit statuses, review target, operational completion, CI decision, coverage, publication, findings-query status, findings, deferrals, and gaps.
        required: true
        min_length: 1
        max_length: 7000
        multiline: true
      - id: unresolved-valid-findings
        type: integer
        prompt: Record the number of unresolved valid findings.
        required: true
        minimum: 0
  hardening-deferral-record:
    type: action
    title: Record epic hardening deferral
    intent: Preserve the bounded second-review findings that epic hardening must reconcile.
    items:
      - id: hardening-deferral-state
        type: choice
        prompt: Record whether a verified hardening deferral is required for the current review evidence.
        required: true
        choices:
          - not-applicable
          - recorded
      - id: hardening-deferral-run-id
        type: text
        prompt: Record the exact committed second-round Mulgae root review run ID.
        required: false
        required_when:
          - item: hardening-deferral-state
            equals: recorded
        min_length: 1
        max_length: 128
        multiline: true
      - id: hardening-deferral-finding-ids
        type: list
        prompt: Record every exact unresolved valid finding ID from that run.
        required: false
        required_when:
          - item: hardening-deferral-state
            equals: recorded
        min_items: 1
        max_items: 200
        max_item_length: 128
        max_total_length: 1000000
        unique: true
      - id: hardening-deferral-summary
        type: text
        prompt: Record the member task and bounded finding severities, dispositions, and repository-relative paths; the exact run and finding IDs are recorded separately.
        required: false
        required_when:
          - item: hardening-deferral-state
            equals: recorded
        min_length: 1
        max_length: 7000
        multiline: true
      - id: hardening-deferral-evidence-path
        type: text
        prompt: Record the staged repository-relative aquarium.promoted-evidence/v1 manifest path that durably preserves this deferral.
        required: false
        required_when:
          - item: hardening-deferral-state
            equals: recorded
        min_length: 1
        max_length: 1024
        multiline: true
      - id: hardening-deferral-evidence-sha256
        type: text
        prompt: Record the exact promoted manifest digest as sha256 followed by a colon and 64 lowercase hexadecimal characters.
        required: false
        required_when:
          - item: hardening-deferral-state
            equals: recorded
        min_length: 71
        max_length: 71
        multiline: false
  evidence-decision:
    type: decision
    title: Evaluate goal evidence
    objective: Only complete current evidence or an explicit bounded member-task deferral may proceed.
    prompt: Does the current evidence support this goal?
    evidence_guidance:
      - Read the goal work, checks, Mulgae status, and finding dispositions.
    options:
      - id: supported
        label: Evidence supports goal
        criteria: Required checks and review are complete, CI passed, and no unresolved valid finding remains; for the final epic closeout only, successful current validation and closeout verification replace a redundant Mulgae review.
        guards:
          - evidence:
              node: record-evidence
              item: unresolved-valid-findings
            equals: 0
          - evidence:
              node: record-hardening-deferral
              item: hardening-deferral-state
            equals: not-applicable
      - id: deferred-for-hardening
        label: Findings deferred to epic hardening
        criteria: Required checks are current, this is an epic member task, its complete second review is recorded in hardening-deferral-eligible mode, and every remaining valid finding is linked before this decision to a verified staged aquarium.promoted-evidence/v1 manifest and payload digests; Mulgae and Podway runtime identities remain non-authoritative local provenance only.
        guards:
          - evidence:
              node: record-evidence
              item: review-mode
            equals: hardening-deferral-eligible
          - evidence:
              node: record-evidence
              item: unresolved-valid-findings
            at_least: 1
          - evidence:
              node: record-hardening-deferral
              item: hardening-deferral-state
            equals: recorded
          - evidence:
              node: record-hardening-deferral
              item: hardening-deferral-finding-ids
            non_empty: true
      - id: rework-required
        label: Rework required
        criteria: Evidence or CI failed, evidence is stale or incomplete, or a valid finding remains without the exact second-review member-task deferral above.
        guards:
          - evidence:
              node: record-evidence
              item: review-mode
            equals: remediation-eligible
          - evidence:
              node: record-evidence
              item: unresolved-valid-findings
            at_least: 1
    reason:
      required: true
      prompt: Explain the selection using the recorded evidence.
  goal-assessment:
    type: decision
    title: Assess the goal
    objective: Determine whether the current goal revision is achieved.
    prompt: What is the outcome of the current goal?
    evidence_guidance:
      - Read the latest work and evidence records and assess every goal criterion.
    options:
      - id: achieved
        label: Goal achieved
        criteria: Fresh criterion assessments support the current goal revision.
      - id: not-achieved
        label: Goal not achieved
        criteria: Fresh evidence does not support the current goal revision.
      - id: superseded
        label: Goal superseded
        criteria: The current goal revision is no longer desired.
    reason:
      required: true
      prompt: Explain the outcome using criterion assessments and evidence.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  hardening-deferral-disposition:
    type: action
    title: Confirm epic hardening handoff
    intent: Record that the pre-decision deferral evidence is the bounded handoff for this member task.
    items:
      - id: hardening-handoff-summary
        type: text
        prompt: Record the adopted hardening evidence path, digest, finding IDs, and owning epic task.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
  closeout-record:
    type: action
    title: Record goal closeout
    intent: Record roadmap, commit, worktree, and publication handoff state.
    items:
      - id: closeout-summary
        type: text
        prompt: Record the outcome, roadmap state, commit, residue, and publication state.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
graph:
  entry: complete-work
  nodes:
    - id: complete-work
      use: work-record
      next: record-evidence
    - id: record-evidence
      use: evidence-record
      next: record-hardening-deferral
    - id: record-hardening-deferral
      use: hardening-deferral-record
      evidence_from:
        - node: record-evidence
          required: true
          items:
            - review-mode
            - review-run-id
            - unresolved-valid-findings
      next: decide-evidence
    - id: decide-evidence
      use: evidence-decision
      evidence_from:
        - node: complete-work
          required: true
          items:
            - work-summary
            - source-revision
        - node: record-evidence
          required: true
          items:
            - review-round
            - review-mode
            - review-run-id
            - evidence-summary
            - unresolved-valid-findings
        - node: record-hardening-deferral
          required: true
          items:
            - hardening-deferral-state
            - hardening-deferral-run-id
            - hardening-deferral-finding-ids
            - hardening-deferral-summary
            - hardening-deferral-evidence-path
            - hardening-deferral-evidence-sha256
      routes:
        supported:
          to: assess-goal
          effect: advance
        deferred-for-hardening:
          to: record-hardening-handoff
          effect: advance
        rework-required:
          to: complete-work
          effect: rework
    - id: record-hardening-handoff
      use: hardening-deferral-disposition
      evidence_from:
        - node: record-hardening-deferral
          required: true
          items:
            - hardening-deferral-run-id
            - hardening-deferral-finding-ids
            - hardening-deferral-summary
            - hardening-deferral-evidence-path
            - hardening-deferral-evidence-sha256
      next: assess-goal
    - id: assess-goal
      use: goal-assessment
      evidence_from:
        - node: complete-work
          required: true
          items:
            - work-summary
            - source-revision
        - node: record-evidence
          required: true
          items:
            - review-round
            - review-mode
            - review-run-id
            - evidence-summary
            - unresolved-valid-findings
        - node: record-hardening-deferral
          required: true
          items:
            - hardening-deferral-state
            - hardening-deferral-run-id
            - hardening-deferral-finding-ids
            - hardening-deferral-summary
            - hardening-deferral-evidence-path
            - hardening-deferral-evidence-sha256
        - node: record-hardening-handoff
          required: false
          items:
            - hardening-handoff-summary
      routes:
        achieved:
          to: closeout
          effect: advance
        not-achieved:
          to: closeout
          effect: advance
        superseded:
          to: closeout
          effect: advance
    - id: closeout
      use: closeout-record
      terminal: true
manual_rework:
  allowed_targets:
    - complete-work
    - record-evidence
