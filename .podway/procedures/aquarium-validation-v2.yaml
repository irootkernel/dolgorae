schema: podway.procedure/v2
id: aquarium-validation-v2
version: "14"
name: Aquarium Validation
purpose: Audit one completed epic through bounded remediation, confirmation, and explicit finding disposition.
description: A bounded Podway procedure for epic-wide audit, one automatic confirmation, user-directed follow-up, and validation closeout.
goal_tracking: true
node_definitions:
  baseline-record:
    type: action
    title: Record validation baseline
    intent: Bind validation to the completed committed epic and its authority.
    instructions:
      - Use the invoking validation handler to bind the exact committed epic, scope, checks, and approved remediation and review envelope.
      - Do not mutate source, install assets, replace sessions, commit, or publish while recording the baseline.
    items:
      - id: baseline-summary
        type: text
        prompt: Record epic identity, committed revision, authority, worktree, dependencies, and evidence baseline.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
      - id: plan-handoff-artifact
        type: artifact
        prompt: Attach an existing approved epic plan only when the owning epic-handler carries a plan handoff.
        required: false
        allowed_media_types:
          - text/markdown
  audit-record:
    type: action
    title: Audit the epic
    intent: Record a fresh requirement matrix, checks, review evidence, and confirmed gaps.
    instructions:
      - Audit the exact current candidate without source mutation and adjudicate gaps against canonical requirements.
      - Separate blockers, eligible Low gaps, unresolved confirmation, and operational result; total confirmed count is descriptive only.
    items:
      - id: audit-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-epic-audit; Podway does not execute or attest the operation.
        help: The declared operation is "Run the complete Aquarium epic audit and repository-authoritative checks for the current validation candidate in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: aquarium-epic-audit
        operation_digest: sha256:4999899d1137c25f8c78e4a595724301e30e0c2e60bf7ca995521df05b88ec74
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: audit-summary
        type: text
        prompt: Record the audited snapshot, matrix result, checks, Mulgae evidence, and confirmed gaps.
        required: true
        min_length: 1
        max_length: 8000
        multiline: true
      - id: confirmed-gap-count
        type: integer
        prompt: Record the number of confirmed in-scope gaps.
        required: true
        minimum: 0
      - id: blocking-gap-count
        type: integer
        prompt: Record current blockers and effective Medium-or-higher gaps.
        required: true
        minimum: 0
      - id: eligible-low-gap-count
        type: integer
        prompt: Record eligible Low gaps that require a supported disposition.
        required: true
        minimum: 0
      - id: confirmation-needed-gap-count
        type: integer
        prompt: Record gaps whose validity or required evidence still needs confirmation.
        required: true
        minimum: 0
      - id: blocking-rework-authority
        type: choice
        prompt: Record whether the current exact blocking set has an existing remediation envelope or requires user direction.
        required: true
        choices:
          - current-envelope
          - user-direction
  gap-decision:
    type: decision
    title: Evaluate audit gaps
    objective: Route the initial audit by operational state, validity, and effective severity rather than total count.
    prompt: What does the fresh initial audit require?
    evidence_guidance:
      - Read the audit snapshot, matrix, checks, review, and confirmed gap count.
    options:
      - id: clean
        label: Audit clean
        criteria: No confirmed gap remains and every required check has current evidence.
        guards:
          - evidence:
              node: audit
              item: audit-result
            field: outcome
            equals: pass
          - evidence:
              node: audit
              item: blocking-gap-count
            equals: 0
          - evidence:
              node: audit
              item: eligible-low-gap-count
            equals: 0
          - evidence:
              node: audit
              item: confirmation-needed-gap-count
            equals: 0
      - id: blocking-gaps
        label: Blocking gaps found
        criteria: At least one current blocker has an existing owned remediation envelope.
        guards:
          - evidence:
              node: audit
              item: audit-result
            field: outcome
            equals: pass
          - evidence:
              node: audit
              item: blocking-gap-count
            at_least: 1
          - evidence:
              node: audit
              item: confirmation-needed-gap-count
            equals: 0
          - evidence:
              node: audit
              item: blocking-rework-authority
            equals: current-envelope
      - id: low-only
        label: Only eligible Low gaps remain
        criteria: No blocker or confirmation gap remains; continue to the independently required final review without broad remediation.
        guards:
          - evidence:
              node: audit
              item: audit-result
            field: outcome
            equals: pass
          - evidence:
              node: audit
              item: blocking-gap-count
            equals: 0
          - evidence:
              node: audit
              item: eligible-low-gap-count
            at_least: 1
          - evidence:
              node: audit
              item: confirmation-needed-gap-count
            equals: 0
      - id: confirmation-required
        label: Gap confirmation required
        criteria: At least one gap needs evidence or validity confirmation before severity routing.
        guards:
          - evidence:
              node: audit
              item: audit-result
            field: outcome
            equals: pass
          - evidence:
              node: audit
              item: confirmation-needed-gap-count
            at_least: 1
      - id: user-direction
        label: Blocking remediation needs direction
        criteria: A blocking set exists without a current remediation envelope.
        guards:
          - evidence:
              node: audit
              item: audit-result
            field: outcome
            equals: pass
          - evidence:
              node: audit
              item: blocking-gap-count
            at_least: 1
          - evidence:
              node: audit
              item: confirmation-needed-gap-count
            equals: 0
          - evidence:
              node: audit
              item: blocking-rework-authority
            equals: user-direction
      - id: incomplete
        label: Audit incomplete
        criteria: The external audit result failed or is inconclusive and cannot support remediation or clean validation.
        guards:
          - evidence:
              node: audit
              item: audit-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the selection using the audit evidence.
  re-audit-decision:
    type: decision
    title: Evaluate remediation re-audit
    objective: Route the remediated candidate by operational state, validity, severity, and remaining authority.
    prompt: What does the fresh re-audit require?
    evidence_guidance:
      - Read the selected re-audit result, summary, and confirmed gap count.
    options:
      - id: clean
        label: Re-audit clean
        criteria: No confirmed gap remains and every required check has current evidence.
        guards:
          - evidence:
              node: re-audit
              item: audit-result
            field: outcome
            equals: pass
          - evidence:
              node: re-audit
              item: blocking-gap-count
            equals: 0
          - evidence:
              node: re-audit
              item: eligible-low-gap-count
            equals: 0
          - evidence:
              node: re-audit
              item: confirmation-needed-gap-count
            equals: 0
      - id: blocking-gaps
        label: Blocking gaps remain with authority
        criteria: At least one blocker remains and the existing caller envelope authorizes another owned remediation cycle.
        guards:
          - evidence:
              node: re-audit
              item: audit-result
            field: outcome
            equals: pass
          - evidence:
              node: re-audit
              item: blocking-gap-count
            at_least: 1
          - evidence:
              node: re-audit
              item: confirmation-needed-gap-count
            equals: 0
          - evidence:
              node: re-audit
              item: blocking-rework-authority
            equals: current-envelope
      - id: low-only
        label: Only eligible Low gaps remain
        criteria: Route Low-only re-audit evidence forward without another broad remediation or audit.
        guards:
          - evidence:
              node: re-audit
              item: audit-result
            field: outcome
            equals: pass
          - evidence:
              node: re-audit
              item: blocking-gap-count
            equals: 0
          - evidence:
              node: re-audit
              item: eligible-low-gap-count
            at_least: 1
          - evidence:
              node: re-audit
              item: confirmation-needed-gap-count
            equals: 0
      - id: confirmation-required
        label: Gap confirmation required
        criteria: Re-audit evidence still needs confirmation before routing.
        guards:
          - evidence:
              node: re-audit
              item: audit-result
            field: outcome
            equals: pass
          - evidence:
              node: re-audit
              item: confirmation-needed-gap-count
            at_least: 1
      - id: user-direction
        label: Blocking remediation needs direction
        criteria: A blocker remains after the current correction envelope is exhausted.
        guards:
          - evidence:
              node: re-audit
              item: audit-result
            field: outcome
            equals: pass
          - evidence:
              node: re-audit
              item: blocking-gap-count
            at_least: 1
          - evidence:
              node: re-audit
              item: confirmation-needed-gap-count
            equals: 0
          - evidence:
              node: re-audit
              item: blocking-rework-authority
            equals: user-direction
      - id: incomplete
        label: Re-audit incomplete
        criteria: The external re-audit result failed or is inconclusive.
        guards:
          - evidence:
              node: re-audit
              item: audit-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the selection using the re-audit evidence.
  remediation-record:
    type: action
    title: Remediate confirmed gaps
    intent: Record one completed owned remediation pass, commits, verification, and source findings.
    instructions:
      - Correct only the exact blocking set within the caller's current envelope and preserve its trigger identity.
      - Do not start per-group review, reset the remediation budget, or use this phase for eligible Low-only gaps.
    items:
      - id: remediation-summary
        type: text
        prompt: Record every remediation completed in this pass with its gap owner, source finding, correction, commit, checks, and remaining external blockers.
        required: true
        min_length: 1
        max_length: 8000
        multiline: true
  audit-low-basis-record:
    type: action
    title: Preserve Low-only audit basis
    intent: Carry the finite Low-only audit set to the independently required final review without broad remediation.
    instructions:
      - Preserve the exact audit target and Low identities; do not re-audit to reduce the historical count.
      - This record does not waive a required first provider review or a confirmation already owed after blocking remediation.
    items:
      - id: audit-basis-target
        type: text
        prompt: Record the exact immutable audit or re-audit target that established this Low-only basis.
        required: true
        min_length: 1
        max_length: 512
        multiline: true
      - id: audit-basis-status
        type: choice
        prompt: Record whether the basis still applies to the current candidate or was invalidated by a material change outside its accepted Low-only delta.
        required: true
        choices:
          - applicable
          - invalidated-by-material-change
      - id: audit-low-finding-count
        type: integer
        prompt: Record the immutable number of eligible Low findings established by the selected audit basis.
        required: true
        minimum: 1
      - id: audit-low-finding-identities
        type: list
        prompt: Record each audit Low finding under an audit-prefixed identity namespace; do not replace these identities with provider findings.
        required: true
        min_items: 1
        max_items: 50
        max_item_length: 512
        max_total_length: 25000
        unique: true
      - id: audit-low-basis-summary
        type: text
        prompt: Record the exact audit or re-audit target, finite eligible Low set, required dispositions, and independently required next review if any.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
  final-review-record:
    type: action
    title: Record final validation evidence
    intent: Record the latest audit and complete whole-epic Mulgae result, including every confirmation finding that requires user direction.
    instructions:
      - Delegate only an independently required whole-epic review and preserve exact lineage, target, CI, coverage, publication, and finding query.
      - Do not launch another provider root solely because Low findings or their accepted local delta remain.
      - Compose the current obligation summary from the selected audit basis and provider findings under separate namespaces; provider counts never erase an applicable audit Low set.
    items:
      - id: review-round
        type: integer
        prompt: Record the positive whole-epic review ordinal, counting each original root once for the current validation goal revision.
        required: true
        minimum: 1
      - id: review-mode
        type: choice
        prompt: Record whether this round may trigger remediation or is confirmation-only.
        required: true
        choices:
          - remediation-eligible
          - confirmation-only
      - id: review-run-id
        type: text
        prompt: Record the exact committed Mulgae root or verified composite review run ID; verify the original root and role sources through review_composition for a composite.
        required: true
        min_length: 1
        max_length: 128
        multiline: true
      - id: final-review-summary
        type: text
        prompt: Record final snapshot, required checks, operational completion, coverage, publication, CI decision, findings query, and roadmap consistency.
        required: true
        min_length: 1
        max_length: 7000
        multiline: true
      - id: completion-assessment-summary
        type: text
        prompt: Record each actual epic requirement by stable criterion identity, responsible owner, met, unmet, unverified, or not-applicable state, and bounded evidence or reference provenance; do not copy full reports or private provider payloads.
        required: true
        min_length: 1
        max_length: 7000
        multiline: true
      - id: completion-unmet-criteria
        type: integer
        prompt: Record the number of actual epic requirements assessed as unmet across all accepted selected-role reports.
        required: true
        minimum: 0
      - id: completion-unverified-criteria
        type: integer
        prompt: Record the number of actual epic requirements assessed as unverified across all accepted selected-role reports.
        required: true
        minimum: 0
      - id: final-review-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-validation-review; Podway does not execute or attest the operation.
        help: The declared operation is "Verify the complete whole-epic review, CI, coverage, publication, and findings query for the current Aquarium validation candidate." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: aquarium-validation-review
        operation_digest: sha256:e1265561a8e3432f405ff7aaf54885ca9596a97f522a555f7d0f49083bc1b8ba
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: final-review-observations
        type: list
        prompt: Record failure or inconclusive review observations.
        required: false
        required_when:
          - item: final-review-result
            field: outcome
            not_equals: pass
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: unresolved-valid-findings
        type: integer
        prompt: Record the number of unresolved valid findings.
        required: true
        minimum: 0
      - id: reported-severity-summary
        type: text
        prompt: Record finding IDs and provider-reported severities before local adjudication, or none.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: confirmation-needed-findings
        type: integer
        prompt: Record the number of findings whose validity still needs confirmation.
        required: true
        minimum: 0
      - id: medium-or-higher-findings
        type: integer
        prompt: Record the number of valid findings with effective priority Blocker, Critical, High, or Medium.
        required: true
        minimum: 0
      - id: blocker-findings
        type: integer
        prompt: Record the number of locally verified findings with effective priority Blocker.
        required: true
        minimum: 0
      - id: critical-findings
        type: integer
        prompt: Record the number of locally verified findings with effective priority Critical.
        required: true
        minimum: 0
      - id: high-findings
        type: integer
        prompt: Record the number of locally verified findings with effective priority High.
        required: true
        minimum: 0
      - id: medium-findings
        type: integer
        prompt: Record the number of locally verified findings with effective priority Medium.
        required: true
        minimum: 0
      - id: low-findings
        type: integer
        prompt: Record the number of locally verified findings with effective priority Low.
        required: true
        minimum: 0
      - id: valid-finding-ids
        type: text
        prompt: Record the exact locally verified finding IDs by severity, or none.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: finding-disposition-summary
        type: text
        prompt: Record validity, effective priority, disposition, owner, verification state, and stale-review status for each finding, or none.
        required: true
        min_length: 1
        max_length: 7000
        multiline: true
      - id: applicable-obligation-summary
        type: text
        prompt: Record every currently applicable audit and provider obligation under separate identity namespaces, including completed and pending dispositions and any invalidated basis.
        required: true
        min_length: 1
        max_length: 7000
        multiline: true
      - id: pending-applicable-low-dispositions
        type: integer
        prompt: Record applicable audit and provider Low obligations that do not yet have one completed shared disposition.
        required: true
        minimum: 0
      - id: current-applicable-blockers
        type: integer
        prompt: Record current valid Medium-or-higher findings, every unmet completion criterion, and any other blocking obligation across the applicable audit and provider evidence.
        required: true
        minimum: 0
      - id: required-evidence-gaps
        type: integer
        prompt: Record every unverified completion criterion, unresolved confirmation, invalidated required audit basis, or another missing mandatory verification prerequisite.
        required: true
        minimum: 0
  final-review-decision:
    type: decision
    title: Settle final Low obligations
    objective: Choose between closeout and local Low settlement after every earlier validation prerequisite has passed.
    prompt: Does any applicable Low obligation remain unsettled?
    evidence_guidance:
      - Earlier serial decisions already admitted operation, confirmation, completion, mandatory evidence, and blockers.
    options:
      - id: validated
        label: Validation supported
        criteria: Every applicable Low obligation is settled.
        guards:
          - evidence:
              node: final-review
              item: pending-applicable-low-dispositions
            equals: 0
      - id: low-disposition
        label: Complete Low dispositions
        criteria: At least one applicable audit or provider Low obligation needs shared local disposition.
        guards:
          - evidence:
              node: final-review
              item: pending-applicable-low-dispositions
            at_least: 1
    reason:
      required: true
      prompt: Explain the selection using the final validation evidence.
  completion-status-decision:
    type: decision
    title: Confirm completion assessment
    objective: Classify completion independently from operation, evidence, findings, and rework authority.
    prompt: What is the aggregate epic completion state?
    evidence_guidance:
      - Unmet criteria use the current review mode and existing remediation authority; unverified criteria stop as incomplete evidence.
    options:
      - id: complete
        label: Completion supported
        criteria: No actual epic requirement is unmet or unverified.
        guards:
          - evidence:
              node: final-review
              item: completion-unmet-criteria
            equals: 0
          - evidence:
              node: final-review
              item: completion-unverified-criteria
            equals: 0
      - id: unmet
        label: Completion requirements unmet
        criteria: At least one criterion is unmet and none remains unverified.
        guards:
          - evidence:
              node: final-review
              item: completion-unmet-criteria
            at_least: 1
          - evidence:
              node: final-review
              item: completion-unverified-criteria
            equals: 0
      - id: unverified
        label: Completion evidence incomplete
        criteria: At least one actual epic requirement remains unverified.
        guards:
          - evidence:
              node: final-review
              item: completion-unverified-criteria
            at_least: 1
    reason:
      required: true
      prompt: Explain the selection using the criterion assessment and current review authority.
  final-review-operation-decision:
    type: decision
    title: Evaluate final review operation
    objective: Admit semantic validation only after the whole-epic review operation passes.
    prompt: Did the final review operation pass?
    options:
      - id: passed
        label: Review operation passed
        criteria: The complete review operation passed.
        guards:
          - evidence:
              node: final-review
              item: final-review-result
            field: outcome
            equals: pass
      - id: incomplete
        label: Review operation incomplete
        criteria: The operation failed or was inconclusive.
        guards:
          - evidence:
              node: final-review
              item: final-review-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the recorded operation result.
  final-review-confirmation-decision:
    type: decision
    title: Confirm final findings
    objective: Prevent unresolved finding validity from entering semantic validation.
    prompt: Are all finding confirmations resolved?
    options:
      - id: resolved
        label: Findings confirmed
        criteria: No finding still needs confirmation.
        guards:
          - evidence:
              node: final-review
              item: confirmation-needed-findings
            equals: 0
      - id: unresolved
        label: Finding confirmation incomplete
        criteria: At least one finding still needs confirmation.
        guards:
          - evidence:
              node: final-review
              item: confirmation-needed-findings
            at_least: 1
    reason:
      required: true
      prompt: Explain the current confirmation state.
  required-evidence-decision:
    type: decision
    title: Evaluate required evidence
    objective: Admit blocker and Low routing only when every mandatory evidence prerequisite is present.
    prompt: Does any required evidence gap remain?
    options:
      - id: complete
        label: Required evidence complete
        criteria: No required evidence gap remains.
        guards:
          - evidence:
              node: final-review
              item: required-evidence-gaps
            equals: 0
      - id: incomplete
        label: Required evidence incomplete
        criteria: At least one required evidence gap remains.
        guards:
          - evidence:
              node: final-review
              item: required-evidence-gaps
            at_least: 1
    reason:
      required: true
      prompt: Explain the mandatory evidence state.
  applicable-blocker-decision:
    type: decision
    title: Evaluate applicable blockers
    objective: Separate the existence of a blocker from authority to remediate it.
    prompt: Does any current applicable blocker remain?
    options:
      - id: clear
        label: No current blocker
        criteria: No current applicable blocker remains.
        guards:
          - evidence:
              node: final-review
              item: current-applicable-blockers
            equals: 0
      - id: blocking
        label: Current blocker remains
        criteria: At least one current applicable blocker remains.
        guards:
          - evidence:
              node: final-review
              item: current-applicable-blockers
            at_least: 1
    reason:
      required: true
      prompt: Explain the composed blocker state.
  validation-rework-authority-decision:
    type: decision
    title: Evaluate validation rework authority
    objective: Route established rework according to the current review mode.
    prompt: Is another remediation and review pass authorized?
    options:
      - id: remediation
        label: Remediate within current authority
        criteria: The review is remediation-eligible.
        guards:
          - evidence:
              node: final-review
              item: review-mode
            equals: remediation-eligible
      - id: user-direction
        label: Await user direction
        criteria: The review is confirmation-only and no later pass is authorized.
        guards:
          - evidence:
              node: final-review
              item: review-mode
            equals: confirmation-only
    reason:
      required: true
      prompt: Explain the current review-mode authority.
  user-direction-record:
    type: action
    title: Await user direction
    intent: Record the need for user direction before waiting for the user's actual choice.
    instructions:
      - Record the exact blocking set and exhausted authority, complete this action, then stop at choose-user-direction with that decision unset until the user answers.
      - Reaching or completing this action grants no source change, review, or re-audit authority.
    items:
      - id: direction-classification
        type: choice
        prompt: Record the classification that requires an external decision.
        required: true
        choices:
          - user-direction
      - id: direction-summary
        type: text
        prompt: Record the source audit or review, exact blocking findings, current target, and bounded choices.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
  review-direction-decision:
    type: decision
    title: Choose the next Medium-or-higher action
    objective: Record one explicit user choice without accepting risk, deferring required correction, or creating an unbounded review loop.
    prompt: What did the user explicitly authorize for the current Medium-or-higher findings?
    evidence_guidance:
      - Read the latest audit, review mode, effective priorities, exact finding IDs, and the user's current instruction.
      - Leave this decision unset until the user explicitly selects the next action.
    options:
      - id: fix-and-review
        label: Fix and review once
        criteria: The user authorized exactly one remediation pass and one next-ordinal whole-epic confirmation review.
      - id: stop
        label: Stop validation
        criteria: The user directed validation to stop without another correction or review.
    reason:
      required: true
      prompt: Record the exact user authority, finding IDs, and bounded next action.
  low-disposition-record:
    type: action
    title: Record completed Low dispositions
    intent: Record proportionate Low handling without claiming that the provider reviewed corrected or newly recorded bytes.
    instructions:
      - Freeze the eligible Low set across direct-audit and provider namespaces and apply only supported dispositions.
      - Verify the exact permitted target delta locally; do not run another review or broad re-audit solely for Low.
    items:
      - id: source-review-basis
        type: text
        prompt: Record validation goal revision, audit and original-root review basis, effective result, reviewed target, and finite finding-set identity.
        required: true
        min_length: 1
        max_length: 2500
        multiline: true
      - id: low-disposition-summary
        type: text
        prompt: Record each finding ID, selected shared disposition, exact correction or canonical owner, impact or reason, re-entry condition, focused checks, commit when applicable, and the preceding review that predates changed bytes.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
      - id: completion-assessment-summary
        type: text
        prompt: Carry the exact criterion-level completion assessment from the admitted review basis.
        required: true
        min_length: 1
        max_length: 7000
        multiline: true
      - id: completion-unmet-criteria
        type: integer
        prompt: Carry the number of unmet completion criteria from the admitted review basis.
        required: true
        minimum: 0
      - id: completion-unverified-criteria
        type: integer
        prompt: Carry the number of unverified completion criteria from the admitted review basis.
        required: true
        minimum: 0
      - id: pending-low-dispositions
        type: integer
        prompt: Record frozen eligible Low findings without a completed disposition.
        required: true
        minimum: 0
      - id: current-blocking-findings
        type: integer
        prompt: Record current blockers established during local verification.
        required: true
        minimum: 0
      - id: before-target
        type: text
        prompt: Record the exact target covered by the selected review or audit basis.
        required: true
        min_length: 1
        max_length: 512
        multiline: true
      - id: after-target
        type: text
        prompt: Record the exact current target containing only the permitted disposition delta.
        required: true
        min_length: 1
        max_length: 512
        multiline: true
      - id: coverage-relationship
        type: choice
        prompt: Record whether the current target is unchanged or contains the accepted Low-only delta.
        required: true
        choices:
          - same-as-review
          - review-predates-low-delta
      - id: low-disposition-verification
        type: check_result
        prompt: Record the caller-supplied aquarium-low-disposition-verification result.
        required: true
        operation_id: aquarium-low-disposition-verification
        operation_digest: sha256:788e0961be2fcf797e891bb55e440d6779b4b9d745818ad186c840acc5df013c
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  low-result-decision:
    type: decision
    title: Evaluate Low verification
    objective: Continue only when required local settlement verification passed.
    prompt: Did Low verification pass on the current target?
    evidence_guidance:
      - Failed or inconclusive local verification returns to settlement and creates no review authority.
    options:
      - id: passed
        label: Low verification passed
        criteria: The disposition delta and required local checks passed.
        guards:
          - evidence:
              node: record-low-disposition
              item: low-disposition-verification
            field: outcome
            equals: pass
      - id: incomplete
        label: Low verification incomplete
        criteria: The local result failed or is inconclusive.
        guards:
          - evidence:
              node: record-low-disposition
              item: low-disposition-verification
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the current local verification result.
  low-completion-decision:
    type: decision
    title: Verify Low settlement
    objective: Advance only after every frozen Low disposition and current local check is complete and the carried completion assessment has no gap.
    prompt: Is the finite Low settlement complete?
    evidence_guidance:
      - Historical Low counts remain unchanged; use pending disposition and current blocker counts plus the completion assessment carried from final-review.
    options:
      - id: completed
        label: Low settlement completed
        criteria: Pending dispositions and current blockers are zero, and the source review has no unmet or unverified completion criterion.
        guards:
          - evidence:
              node: record-low-disposition
              item: pending-low-dispositions
            equals: 0
          - evidence:
              node: record-low-disposition
              item: current-blocking-findings
            equals: 0
          - evidence:
              node: record-low-disposition
              item: completion-unmet-criteria
            equals: 0
          - evidence:
              node: record-low-disposition
              item: completion-unverified-criteria
            equals: 0
      - id: incomplete
        label: Low dispositions incomplete
        criteria: At least one disposition remains and no blocker has been established.
        guards:
          - evidence:
              node: record-low-disposition
              item: current-blocking-findings
            equals: 0
          - evidence:
              node: record-low-disposition
              item: pending-low-dispositions
            at_least: 1
      - id: blocker-found
        label: Current blocker found
        criteria: Settlement evidence established a current blocker requiring owned remediation or direction.
        guards:
          - evidence:
              node: record-low-disposition
              item: current-blocking-findings
            at_least: 1
    reason:
      required: true
      prompt: Explain the remaining disposition or blocking state.
  disposition-record:
    type: action
    title: Record validation disposition
    intent: Preserve one explicit user or operational disposition before goal assessment.
    instructions:
      - Record an actual stop or incomplete outcome without relabeling it successful or starting replacement work.
    items:
      - id: disposition-summary
        type: text
        prompt: Record the disposition, exact authority or operational evidence, affected finding IDs, and residual risk.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
  goal-assessment:
    type: decision
    title: Assess the epic validation goal
    objective: Determine whether current evidence supports the validation goal.
    prompt: What is the outcome of the validation goal?
    evidence_guidance:
      - Read the baseline, latest audit, remediation history, final review, any completed Low settlement, and any explicit user disposition.
      - On the direct validated path, require the current final-review pending disposition, blocker, and evidence-gap counts to be zero.
      - On the completed Low-settlement path, require the latest record-low-disposition zero pending and blocker counts, passing verification, and exact accepted final target.
      - Treat the earlier positive final-review pending count as historical; it does not require another review after complete Low settlement.
    options:
      - id: achieved
        label: Goal achieved
        criteria: This assessment was reached from validated with zero current final-review pending dispositions, blockers, and evidence gaps, or from completed record-low-disposition with zero pending dispositions and current blockers, a passing Low-disposition verification result, and the exact accepted final target; required audit and review evidence is operationally complete, and every historical finding remains recorded under its source namespace.
      - id: not-achieved
        label: Goal not achieved
        criteria: Fresh evidence does not support the current validation goal, including every path reached from record-stopped, record-incomplete, or record-review-operation-incomplete; those dispositions can never select achieved.
      - id: superseded
        label: Goal superseded
        criteria: The current validation goal is no longer desired.
    reason:
      required: true
      prompt: Explain the outcome using criterion assessments and evidence.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  closeout-record:
    type: action
    title: Record validation closeout
    intent: Record the final audited snapshot, any current-semantics repository change or explicit no-change result, residue, and publication state.
    instructions:
      - Close only from current achieved evidence and an exact required commit or supported no-change result.
      - Do not install, activate, replace sessions, push, or publish by implication.
    items:
      - id: closeout-summary
        type: text
        prompt: Record validation outcome, any required lifecycle or actionable-handoff commit, or the verified reason no repository record is required.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: promoted-evidence-references
        type: list
        prompt: Record each committed aquarium.promoted-evidence/v1 manifest as its repository-relative path followed by exactly one sha256-prefixed 64-hex manifest digest; leave absent when no package applies.
        required: false
        min_items: 0
        max_items: 50
        max_item_length: 1200
        max_total_length: 1000000
        unique: true
graph:
  entry: capture-baseline
  nodes:
    - id: capture-baseline
      use: baseline-record
      next: audit
    - id: audit
      use: audit-record
      next: decide-gaps
    - id: decide-gaps
      use: gap-decision
      evidence_from:
        - node: audit
          required: true
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
            - blocking-rework-authority
      routes:
        clean:
          to: final-review
          effect: advance
        blocking-gaps:
          to: remediate
          effect: advance
        low-only:
          to: record-audit-low-basis
          effect: advance
        confirmation-required:
          to: audit
          effect: rework
        user-direction:
          to: await-user-direction
          effect: advance
        incomplete:
          to: record-incomplete
          effect: advance
    - id: remediate
      use: remediation-record
      next: re-audit
    - id: re-audit
      use: audit-record
      evidence_from:
        - node: remediate
          required: true
          items:
            - remediation-summary
      next: decide-re-audit
    - id: decide-re-audit
      use: re-audit-decision
      evidence_from:
        - node: re-audit
          required: true
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
            - blocking-rework-authority
      routes:
        clean:
          to: final-review
          effect: advance
        blocking-gaps:
          to: remediate
          effect: rework
        low-only:
          to: record-audit-low-basis
          effect: advance
        confirmation-required:
          to: re-audit
          effect: rework
        user-direction:
          to: await-user-direction
          effect: advance
        incomplete:
          to: record-incomplete
          effect: advance
    - id: record-audit-low-basis
      use: audit-low-basis-record
      evidence_from:
        - node: audit
          required: false
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
        - node: re-audit
          required: false
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
      next: final-review
    - id: final-review
      use: final-review-record
      evidence_from:
        - node: audit
          required: true
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
            - blocking-rework-authority
        - node: re-audit
          required: false
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
            - blocking-rework-authority
        - node: record-audit-low-basis
          required: false
          items:
            - audit-basis-target
            - audit-basis-status
            - audit-low-finding-count
            - audit-low-finding-identities
            - audit-low-basis-summary
      next: decide-final-review-operation
    - id: decide-final-review-operation
      use: final-review-operation-decision
      evidence_from:
        - node: final-review
          required: true
          items:
            - final-review-result
            - final-review-observations
      routes:
        passed:
          to: confirm-final-review-findings
          effect: advance
        incomplete:
          to: record-review-operation-incomplete
          effect: advance
    - id: confirm-final-review-findings
      use: final-review-confirmation-decision
      evidence_from:
        - node: final-review
          required: true
          items:
            - confirmation-needed-findings
      routes:
        resolved:
          to: confirm-completion-assessment
          effect: advance
        unresolved:
          to: record-incomplete
          effect: advance
    - id: confirm-completion-assessment
      use: completion-status-decision
      evidence_from:
        - node: final-review
          required: true
          items:
            - completion-assessment-summary
            - completion-unmet-criteria
            - completion-unverified-criteria
      routes:
        complete:
          to: decide-required-evidence
          effect: advance
        unmet:
          to: decide-validation-rework-authority
          effect: advance
        unverified:
          to: record-incomplete
          effect: advance
    - id: decide-required-evidence
      use: required-evidence-decision
      evidence_from:
        - node: final-review
          required: true
          items:
            - required-evidence-gaps
      routes:
        complete:
          to: decide-current-blockers
          effect: advance
        incomplete:
          to: record-incomplete
          effect: advance
    - id: decide-current-blockers
      use: applicable-blocker-decision
      evidence_from:
        - node: final-review
          required: true
          items:
            - current-applicable-blockers
      routes:
        clear:
          to: decide-final-review
          effect: advance
        blocking:
          to: decide-validation-rework-authority
          effect: advance
    - id: decide-validation-rework-authority
      use: validation-rework-authority-decision
      evidence_from:
        - node: final-review
          required: true
          items:
            - review-mode
      routes:
        remediation:
          to: audit
          effect: rework
        user-direction:
          to: await-user-direction
          effect: advance
    - id: decide-final-review
      use: final-review-decision
      evidence_from:
        - node: final-review
          required: true
          items:
            - review-round
            - review-mode
            - review-run-id
            - final-review-summary
            - final-review-result
            - reported-severity-summary
            - finding-disposition-summary
            - applicable-obligation-summary
            - pending-applicable-low-dispositions
            - current-applicable-blockers
            - required-evidence-gaps
      routes:
        validated:
          to: assess-goal
          effect: advance
        low-disposition:
          to: record-low-disposition
          effect: advance
    - id: await-user-direction
      use: user-direction-record
      evidence_from:
        - node: final-review
          required: false
          items:
            - review-mode
            - medium-or-higher-findings
            - blocker-findings
            - critical-findings
            - high-findings
            - medium-findings
            - low-findings
            - valid-finding-ids
            - confirmation-needed-findings
            - finding-disposition-summary
            - applicable-obligation-summary
            - pending-applicable-low-dispositions
            - current-applicable-blockers
            - required-evidence-gaps
        - node: final-review
          required: false
          items:
            - completion-assessment-summary
            - completion-unmet-criteria
            - completion-unverified-criteria
        - node: audit
          required: false
          items:
            - audit-summary
            - blocking-gap-count
            - blocking-rework-authority
        - node: re-audit
          required: false
          items:
            - audit-summary
            - blocking-gap-count
            - blocking-rework-authority
        - node: record-low-disposition
          required: false
          items:
            - source-review-basis
            - low-disposition-summary
            - current-blocking-findings
            - after-target
      next: choose-user-direction
    - id: choose-user-direction
      use: review-direction-decision
      evidence_from:
        - node: await-user-direction
          required: true
          items:
            - direction-classification
            - direction-summary
      routes:
        fix-and-review:
          to: audit
          effect: rework
        stop:
          to: record-stopped
          effect: advance
    - id: record-low-disposition
      use: low-disposition-record
      evidence_from:
        - node: final-review
          required: true
          items:
            - review-run-id
            - final-review-summary
            - completion-assessment-summary
            - completion-unmet-criteria
            - completion-unverified-criteria
            - medium-or-higher-findings
            - low-findings
            - reported-severity-summary
            - finding-disposition-summary
            - applicable-obligation-summary
            - pending-applicable-low-dispositions
            - current-applicable-blockers
            - required-evidence-gaps
      next: decide-low-result
    - id: decide-low-result
      use: low-result-decision
      evidence_from:
        - node: record-low-disposition
          required: true
          items:
            - low-disposition-verification
      routes:
        passed:
          to: decide-low-completion
          effect: advance
        incomplete:
          to: record-low-disposition
          effect: rework
    - id: decide-low-completion
      use: low-completion-decision
      evidence_from:
        - node: record-low-disposition
          required: true
          items:
            - source-review-basis
            - low-disposition-summary
            - completion-assessment-summary
            - completion-unmet-criteria
            - completion-unverified-criteria
            - pending-low-dispositions
            - current-blocking-findings
            - before-target
            - after-target
            - coverage-relationship
            - low-disposition-verification
      routes:
        completed:
          to: assess-goal
          effect: advance
        incomplete:
          to: record-low-disposition
          effect: rework
        blocker-found:
          to: await-user-direction
          effect: advance
    - id: record-stopped
      use: disposition-record
      next: assess-goal
    - id: record-incomplete
      use: disposition-record
      next: assess-goal
    - id: record-review-operation-incomplete
      use: disposition-record
      next: assess-goal
    - id: assess-goal
      use: goal-assessment
      evidence_from:
        - node: capture-baseline
          required: true
          items:
            - baseline-summary
        - node: final-review
          required: false
          items:
            - final-review-result
            - unresolved-valid-findings
            - confirmation-needed-findings
            - medium-or-higher-findings
            - blocker-findings
            - critical-findings
            - high-findings
            - medium-findings
            - low-findings
            - finding-disposition-summary
            - applicable-obligation-summary
            - pending-applicable-low-dispositions
            - current-applicable-blockers
            - required-evidence-gaps
        - node: final-review
          required: false
          items:
            - completion-assessment-summary
            - completion-unmet-criteria
            - completion-unverified-criteria
        - node: await-user-direction
          required: false
          items:
            - direction-classification
            - direction-summary
        - node: record-low-disposition
          required: false
          items:
            - source-review-basis
            - low-disposition-summary
            - pending-low-dispositions
            - current-blocking-findings
            - before-target
            - after-target
            - coverage-relationship
            - low-disposition-verification
        - node: record-stopped
          required: false
          items:
            - disposition-summary
        - node: record-incomplete
          required: false
          items:
            - disposition-summary
        - node: record-review-operation-incomplete
          required: false
          items:
            - disposition-summary
      routes:
        achieved:
          to: closeout
          effect: advance
        not-achieved:
          to: closeout
          effect: advance
        superseded:
          to: closeout
          effect: advance
    - id: closeout
      use: closeout-record
      terminal: true
manual_rework:
  allowed_targets:
    - audit
    - remediate
    - re-audit
    - final-review
    - record-low-disposition
