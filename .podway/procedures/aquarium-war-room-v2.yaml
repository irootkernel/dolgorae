schema: podway.procedure/v2
id: aquarium-war-room-v2
version: "2"
name: Aquarium War Room
purpose: Diagnose one difficult bug and produce an approved task, epic, or incomplete-investigation record without implementing a fix.
description: A Podway record of incident baseline or reproduction, investigation, semantic cause and scope decisions, guarded proposal quality, exact-diff approval, documentation, and closeout.
goal_tracking: true
node_definitions:
  baseline-record:
    type: action
    title: Capture incident baseline
    intent: Bind the investigation to symptoms, authority, safe scope, and the approved provider boundary.
    items:
      - id: reproduction-state
        type: choice
        prompt: Record whether the defect was reproduced safely in the approved boundary.
        required: true
        choices:
          - reproduced
          - not-reproduced
          - reproduction-not-required
      - id: observed-behavior
        type: text
        prompt: Record the observed behavior, including the bounded reproduction result or the evidence available when reproduction was not safe or required.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
      - id: expected-behavior
        type: text
        prompt: Record the authority-backed expected behavior and the exact divergence under investigation.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
      - id: baseline-summary
        type: text
        prompt: Record canonical identity, symptoms, revisions, sources and digests, safe reproduction boundary, exclusions, and gaps.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
  investigation-record:
    type: action
    title: Reproduce and investigate
    intent: Record isolated reproduction, hypotheses, tests, and observations without source mutation.
    items:
      - id: investigation-summary
        type: text
        prompt: Record fixture paths, commands, observations, hypothesis outcomes, provider operation IDs, and repository status.
        required: true
        min_length: 1
        max_length: 8000
        multiline: true
  cause-decision:
    type: decision
    title: Evaluate root cause
    objective: Distinguish an evidence-backed cause from an investigation that needs another bounded pass.
    prompt: Is the root cause sufficiently established to shape work?
    evidence_guidance:
      - Read reproductions, competing hypotheses, authority, and counter-evidence.
    options:
      - id: established
        label: Root cause established
        criteria: Current evidence identifies a causal mechanism and affected boundary.
      - id: investigate-more
        label: More investigation required
        criteria: A safe bounded investigation can materially reduce remaining uncertainty.
      - id: blocked
        label: Investigation blocked
        criteria: Required evidence cannot be obtained within the approved safe scope.
    reason:
      required: true
      prompt: Explain the decision from current evidence.
  scope-decision:
    type: decision
    title: Classify the work unit
    objective: End diagnosis with exactly one bounded task, one epic, or an incomplete investigation.
    prompt: What artifact should this investigation produce?
    evidence_guidance:
      - Read the established cause or blocker, affected contracts, dependencies, and risks.
    options:
      - id: task
        label: Bounded task
        criteria: One coherent work unit can correct and verify the cause.
      - id: epic
        label: Multi-work-unit epic
        criteria: Correctness requires ordered work across multiple owners or seams.
      - id: incomplete
        label: Investigation incomplete
        criteria: Root cause or safe verification remains insufficient for implementation authority.
    reason:
      required: true
      prompt: Explain the classification and ownership boundary.
  proposal-record:
    type: action
    title: Record the work-unit proposal
    intent: Bind approval to one exact task, epic, or incomplete-investigation draft.
    items:
      - id: proposal-summary
        type: text
        prompt: Record target paths, draft digests, scope, evidence, acceptance checks, and risks.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
  quality-record:
    type: action
    title: Record diagnostic quality review
    intent: Record the Ouroboros quality pass and local adjudication for the selected diagnostic draft.
    items:
      - id: quality-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-diagnostic-quality; Podway does not execute or attest the operation.
        help: The declared operation is "Review the current Aquarium diagnostic proposal, investigation evidence, classification, and trust claims outside Podway in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: aquarium-diagnostic-quality
        operation_digest: sha256:c0ffd5f99c1298e6e184c69ab32ef83baa5db605e30ed201598f63770bc7cbbd
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: quality-summary
        type: text
        prompt: Record the reviewed draft identity and digest, Ouroboros QA operation, locally verified findings, adjudication, and repository status.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: unresolved-investigation-findings
        type: integer
        prompt: Record the number of unresolved baseline, reproduction, or investigation findings.
        required: true
        minimum: 0
      - id: unresolved-proposal-findings
        type: integer
        prompt: Record the number of unresolved classification, proposal, or trust-claim findings.
        required: true
        minimum: 0
      - id: investigation-findings
        type: list
        prompt: Record bounded unresolved baseline, reproduction, or investigation findings.
        required: false
        required_when:
          - item: unresolved-investigation-findings
            at_least: 1
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: proposal-findings
        type: list
        prompt: Record bounded unresolved classification, proposal, or trust-claim findings.
        required: false
        required_when:
          - item: unresolved-proposal-findings
            at_least: 1
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: quality-observations
        type: list
        prompt: Record failure or inconclusive quality-operation observations.
        required: false
        required_when:
          - item: quality-result
            field: outcome
            not_equals: pass
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
  quality-decision:
    type: decision
    title: Evaluate diagnostic quality
    objective: Route the quality result to the phase that owns each correction before approval.
    prompt: Is the selected diagnostic draft ready for exact-diff approval?
    evidence_guidance:
      - Read the selected draft, Ouroboros QA result, local adjudication, and unresolved-valid-findings count.
    options:
      - id: passed
        label: Quality passed
        criteria: The external quality result passed and no unresolved investigation or proposal finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-investigation-findings
            equals: 0
          - evidence:
              node: quality
              item: unresolved-proposal-findings
            equals: 0
      - id: investigation-changes
        label: Investigation changes required
        criteria: At least one baseline, reproduction, or investigation finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-investigation-findings
            at_least: 1
      - id: proposal-changes
        label: Proposal changes required
        criteria: No investigation finding remains and at least one classification, proposal, or trust-claim finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-investigation-findings
            equals: 0
          - evidence:
              node: quality
              item: unresolved-proposal-findings
            at_least: 1
      - id: incomplete
        label: Quality review incomplete
        criteria: The external quality result failed or is inconclusive.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the quality decision from the current draft and adjudicated findings.
  approval-decision:
    type: decision
    title: Record exact-diff approval
    objective: Apply only the complete diagnostic document diff explicitly approved by the user.
    prompt: Did the user approve the displayed target paths and complete diff?
    evidence_guidance:
      - Compare the displayed proposal with current target snapshots.
    options:
      - id: approved
        label: Exact diff approved
        criteria: The complete diff was explicitly approved and target snapshots are unchanged.
      - id: changes-requested
        label: Changes requested
        criteria: The proposal was rejected, changed, or became stale.
    reason:
      required: true
      prompt: Record the user's decision and exact approved boundary.
  documentation-record:
    type: action
    title: Apply diagnostic documents
    intent: Record only the approved roadmap or investigation-note changes and validation.
    items:
      - id: documentation-summary
        type: text
        prompt: Record applied paths and digests, validation, and work-unit classification.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
  goal-assessment:
    type: decision
    title: Assess the diagnostic goal
    objective: Determine whether diagnosis produced its approved non-implementation artifact.
    prompt: What is the outcome of the war-room goal?
    evidence_guidance:
      - Read investigation evidence, approved documents, validation, and remaining gaps.
    options:
      - id: achieved
        label: Goal achieved
        criteria: An approved task, epic, or incomplete-investigation record is applied and validated.
      - id: not-achieved
        label: Goal not achieved
        criteria: The required evidence or approved artifact remains incomplete.
      - id: superseded
        label: Goal superseded
        criteria: The diagnostic outcome is no longer desired.
    reason:
      required: true
      prompt: Explain the outcome using current evidence.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  closeout-record:
    type: action
    title: Record war-room closeout
    intent: Record final classification, evidence, artifacts, residue, and publication state without a fix.
    items:
      - id: closeout-summary
        type: text
        prompt: Record classification, paths and digests, evidence gaps, repository residue, and next explicit workflow.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
graph:
  entry: capture-baseline
  nodes:
    - id: capture-baseline
      use: baseline-record
      next: investigate
    - id: investigate
      use: investigation-record
      evidence_from:
        - node: capture-baseline
          required: true
          items:
            - reproduction-state
            - observed-behavior
            - expected-behavior
            - baseline-summary
      next: decide-cause
    - id: decide-cause
      use: cause-decision
      evidence_from:
        - node: investigate
          required: true
          items:
            - investigation-summary
      routes:
        established:
          to: classify-scope
          effect: advance
        investigate-more:
          to: investigate
          effect: rework
        blocked:
          to: draft-incomplete
          effect: advance
    - id: classify-scope
      use: scope-decision
      evidence_from:
        - node: investigate
          required: true
          items:
            - investigation-summary
        - node: decide-cause
          required: true
      routes:
        task:
          to: draft-task
          effect: advance
        epic:
          to: draft-epic
          effect: advance
        incomplete:
          to: draft-incomplete
          effect: advance
    - id: draft-task
      use: proposal-record
      next: quality
    - id: draft-epic
      use: proposal-record
      next: quality
    - id: draft-incomplete
      use: proposal-record
      next: quality
    - id: quality
      use: quality-record
      evidence_from:
        - node: draft-task
          required: false
          items:
            - proposal-summary
        - node: draft-epic
          required: false
          items:
            - proposal-summary
        - node: draft-incomplete
          required: false
          items:
            - proposal-summary
      next: decide-quality
    - id: decide-quality
      use: quality-decision
      evidence_from:
        - node: draft-task
          required: false
          items:
            - proposal-summary
        - node: draft-epic
          required: false
          items:
            - proposal-summary
        - node: draft-incomplete
          required: false
          items:
            - proposal-summary
        - node: quality
          required: true
          items:
            - quality-result
            - quality-summary
            - unresolved-investigation-findings
            - unresolved-proposal-findings
            - investigation-findings
            - proposal-findings
            - quality-observations
      routes:
        passed:
          to: approve-diff
          effect: advance
        investigation-changes:
          to: capture-baseline
          effect: rework
        proposal-changes:
          to: investigate
          effect: rework
        incomplete:
          to: quality
          effect: rework
    - id: approve-diff
      use: approval-decision
      evidence_from:
        - node: draft-task
          required: false
          items:
            - proposal-summary
        - node: draft-epic
          required: false
          items:
            - proposal-summary
        - node: draft-incomplete
          required: false
          items:
            - proposal-summary
        - node: quality
          required: true
          items:
            - quality-result
            - quality-summary
            - unresolved-investigation-findings
            - unresolved-proposal-findings
      routes:
        approved:
          to: document
          effect: advance
        changes-requested:
          to: investigate
          effect: rework
    - id: document
      use: documentation-record
      evidence_from:
        - node: draft-task
          required: false
          items:
            - proposal-summary
        - node: draft-epic
          required: false
          items:
            - proposal-summary
        - node: draft-incomplete
          required: false
          items:
            - proposal-summary
        - node: approve-diff
          required: true
      next: assess-goal
    - id: assess-goal
      use: goal-assessment
      evidence_from:
        - node: investigate
          required: true
          items:
            - investigation-summary
        - node: document
          required: true
          items:
            - documentation-summary
      routes:
        achieved:
          to: closeout
          effect: advance
        not-achieved:
          to: closeout
          effect: advance
        superseded:
          to: closeout
          effect: advance
    - id: closeout
      use: closeout-record
      evidence_from:
        - node: assess-goal
          required: true
      terminal: true
manual_rework:
  allowed_targets:
    - investigate
    - draft-task
    - draft-epic
    - draft-incomplete
