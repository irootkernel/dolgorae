        - node: prepare-review
          required: true
          items:
            - prior-assessment-ordinal
            - prior-review-operation
            - prior-review-route
            - prior-route-change-readiness
      routes:
        unsettled:
          to: authorize-incomplete-review-route
          effect: advance
        completed:
          to: authorize-completed-review-route
          effect: advance
    - id: authorize-planned-review-route
