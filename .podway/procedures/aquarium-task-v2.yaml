schema: podway.procedure/v2
id: aquarium-task-v2
version: "5"
name: Aquarium Task
purpose: Deliver one approved roadmap task through the complete Aquarium evidence workflow.
description: A Podway record of task-handler planning, implementation, refinement, verification, documentation, review, approval, and closeout.
goal_tracking: true
node_definitions:
  plan-record:
    type: action
    title: Record the approved plan
    intent: Bind execution to the approved task plan and authority.
    items:
      - id: plan-summary
        type: text
        prompt: Record the approved plan and its authority boundary.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: plan-handoff-artifact
        type: artifact
        prompt: Attach the approved Markdown plan only for an explicit plan handoff.
        required: false
        allowed_media_types:
          - text/markdown
  implementation-entry-record:
    type: action
    title: Prepare implementation entry
    intent: Bind implementation either to the approved plan or to an operationally complete failed review CI decision.
    items:
      - id: implementation-entry-summary
        type: text
        prompt: Record the approved-plan basis on first entry or the exact failed review CI and rework basis on CI re-entry.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
  implementation-record:
    type: action
    title: Record implementation
    intent: Record the isolated implementation and focused evidence.
    items:
      - id: implementation-summary
        type: text
        prompt: Summarize the implemented requirements and task-owned paths.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: source-revision
        type: text
        prompt: Record HEAD and the task-owned dirty-tree identity.
        required: true
        min_length: 1
        max_length: 512
        multiline: true
  verification-record:
    type: action
    title: Record verification
    intent: Record current requirement-mapped verification evidence.
    items:
      - id: verification-result
        type: check_result
        prompt: Record the caller-supplied result for software-change-verification; Podway does not execute or attest the operation.
        help: The declared operation is "Run the repository-authoritative verification required for the current software change in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: software-change-verification
        operation_digest: sha256:b904aefd4dbd6b01337645fd34b1424efc9faf3d22c936de666305335076969e
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: verification-observations
        type: list
        prompt: Record failure or inconclusive observations, commands, actors, exit statuses, evidence references, and gaps.
        required: false
        required_when:
          - item: verification-result
            field: outcome
            not_equals: pass
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
  verification-decision:
    type: decision
    title: Evaluate verification
    objective: Only a task with acceptable current evidence may proceed.
    prompt: Does the recorded verification satisfy the roadmap requirements?
    evidence_guidance:
      - Read the implementation revision and complete verification summary.
    options:
      - id: passed
        label: Verification passed
        criteria: All required checks have current acceptable evidence.
        guards:
          - evidence:
              node: verify
              item: verification-result
            field: outcome
            equals: pass
      - id: failed
        label: Verification failed
        criteria: A required check failed, is stale, or lacks required evidence.
        guards:
          - evidence:
              node: verify
              item: verification-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the decision using the recorded evidence.
  refinement-record:
    type: action
    title: Record refinement
    intent: Record deslop, optimization, staged baseline, and refreshed checks.
    items:
      - id: refinement-summary
        type: text
        prompt: Record cleanup, optimization reasoning, staging scope, and refreshed evidence.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
  documentation-record:
    type: action
    title: Record documentation
    intent: Record durable documentation and roadmap review-state evidence.
    items:
      - id: documentation-summary
        type: text
        prompt: Record documentation paths, synchronization, validation, and roadmap state.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
  review-record:
    type: action
    title: Record Mulgae review
    intent: Record complete review capture and adjudicated findings.
    items:
      - id: review-round
        type: integer
        prompt: Record the positive root-review ordinal for the current goal revision.
        required: true
        minimum: 1
      - id: review-mode
        type: choice
        prompt: Record whether this round may trigger remediation or is confirmation-only.
        required: true
        choices:
          - remediation-eligible
          - confirmation-only
      - id: review-run-id
        type: text
        prompt: Record the exact committed Mulgae root review run ID.
        required: true
        min_length: 1
        max_length: 128
        multiline: true
      - id: review-summary
        type: text
        prompt: Record target, operational completion, coverage, publication, CI decision, findings query, and dispositions.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: ci-decision
        type: choice
        prompt: Record the exact Mulgae CI decision for this operationally complete review.
        required: true
        choices:
          - pass
          - fail
      - id: unresolved-valid-findings
        type: integer
        prompt: Record the number of unresolved valid findings.
        required: true
        minimum: 0
      - id: unresolved-implementation-findings
        type: integer
        prompt: Record the number of unresolved findings owned by implementation or refinement.
        required: true
        minimum: 0
      - id: unresolved-documentation-findings
        type: integer
        prompt: Record the number of unresolved findings owned by documentation.
        required: true
        minimum: 0
  review-decision:
    type: decision
    title: Evaluate review
    objective: Route an incomplete or remediation-eligible review to rework, approve only a clean review, and leave a confirmation-only review with valid findings undecided for user direction.
    prompt: Is the latest complete task target ready for goal assessment?
    evidence_guidance:
      - Read the review ordinal, mode, exact Mulgae run, findings dispositions, and current post-review verification evidence.
      - Select no option while a confirmation-only review retains a valid finding and the user has not authorized the next action.
    options:
      - id: approved
        label: Review approved
        criteria: The root review is operationally complete, CI passed, no valid unresolved finding remains, and the review pass changed no files.
        guards:
          - evidence:
              node: review
              item: ci-decision
            equals: pass
          - evidence:
              node: review
              item: unresolved-valid-findings
            equals: 0
          - evidence:
              node: review
              item: unresolved-implementation-findings
            equals: 0
          - evidence:
              node: review
              item: unresolved-documentation-findings
            equals: 0
      - id: ci-failed
        label: CI failed
        criteria: The root review is operationally complete, but its CI decision failed and requires implementation rework regardless of finding counts.
        guards:
          - evidence:
              node: review
              item: ci-decision
            equals: fail
      - id: implementation-changes
        label: Implementation changes requested
        criteria: A remediation-eligible review whose CI passed has a valid implementation or refinement finding. Do not select this option for a confirmation-only hold without user authorization.
        guards:
          - evidence:
              node: review
              item: ci-decision
            equals: pass
          - evidence:
              node: review
              item: review-mode
            equals: remediation-eligible
          - evidence:
              node: review
              item: unresolved-implementation-findings
            at_least: 1
      - id: documentation-changes
        label: Documentation changes requested
        criteria: A remediation-eligible review has no implementation finding and at least one documentation finding.
        guards:
          - evidence:
              node: review
              item: ci-decision
            equals: pass
          - evidence:
              node: review
              item: review-mode
            equals: remediation-eligible
          - evidence:
              node: review
              item: unresolved-implementation-findings
            equals: 0
          - evidence:
              node: review
              item: unresolved-documentation-findings
            at_least: 1
    reason:
      required: true
      prompt: Explain the decision using the recorded review evidence.
  goal-assessment:
    type: decision
    title: Assess the task goal
    objective: Determine the current roadmap task goal from fresh evidence.
    prompt: What is the outcome of the current task goal?
    evidence_guidance:
      - Read the approved plan, latest implementation, verification, documentation, and review evidence.
    options:
      - id: achieved
        label: Goal achieved
        criteria: Fresh criterion assessments support the current goal revision.
      - id: not-achieved
        label: Goal not achieved
        criteria: Fresh evidence does not support the current goal revision.
      - id: superseded
        label: Goal superseded
        criteria: The current goal revision is no longer the desired outcome.
    reason:
      required: true
      prompt: Explain the outcome using criterion assessments and evidence.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  outcome-record:
    type: action
    title: Record the assessed outcome
    intent: Record the outcome and any required follow-up before approval.
    items:
      - id: outcome-summary
        type: text
        prompt: Record the assessed outcome and follow-up commitments.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
  approval-decision:
    type: decision
    title: Record final user approval
    objective: Close only with the task-close confirmations required by repository authority; a rejection whose correction changes behavior must reach implementation through manual rework.
    prompt: Did the user accept tests, documentation, and the exact final implementation?
    evidence_guidance:
      - Read the assessed outcome and the exact final diff presented to the user.
    options:
      - id: approved
        label: Final approval granted
        criteria: Every applicable task-close confirmation is affirmative.
      - id: changes-requested
        label: Changes requested
        criteria: A confirmation is explicitly negative, requests a correction, or names a specific unmet gate.
    reason:
      required: true
      prompt: Record the user's decision and the approved authority boundary.
  closeout-record:
    type: action
    title: Record task closeout
    intent: Record final roadmap, commit, worktree, and publication states.
    items:
      - id: closeout-summary
        type: text
        prompt: Record terminal roadmap state, commit if any, worktree state, and publication state.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
      - id: promoted-evidence-references
        type: list
        prompt: Record each committed aquarium.promoted-evidence/v1 manifest as its repository-relative path followed by exactly one sha256-prefixed 64-hex manifest digest; leave absent when no package applies.
        required: false
        min_items: 0
        max_items: 50
        max_item_length: 1200
        max_total_length: 1000000
        unique: true
graph:
  entry: record-plan
  nodes:
    - id: record-plan
      use: plan-record
      next: prepare-implementation
    - id: prepare-implementation
      use: implementation-entry-record
      evidence_from:
        - node: record-plan
          required: true
          items:
            - plan-summary
      next: implement
    - id: implement
      use: implementation-record
      next: refine
    - id: refine
      use: refinement-record
      evidence_from:
        - node: implement
          required: true
          items:
            - implementation-summary
            - source-revision
      next: verify
    - id: verify
      use: verification-record
      evidence_from:
        - node: refine
          required: true
          items:
            - refinement-summary
      next: decide-verification
    - id: decide-verification
      use: verification-decision
      evidence_from:
        - node: verify
          required: true
          items:
            - verification-result
            - verification-observations
      routes:
        passed:
          to: document
          effect: advance
        failed:
          to: refine
          effect: rework
    - id: document
      use: documentation-record
      next: review
    - id: review
      use: review-record
      evidence_from:
        - node: verify
          required: true
          items:
            - verification-result
        - node: document
          required: true
          items:
            - documentation-summary
      next: decide-review
    - id: decide-review
      use: review-decision
      evidence_from:
        - node: review
          required: true
          items:
            - review-round
            - review-mode
            - review-run-id
            - review-summary
            - ci-decision
            - unresolved-valid-findings
            - unresolved-implementation-findings
            - unresolved-documentation-findings
      routes:
        approved:
          to: assess-goal
          effect: advance
        ci-failed:
          to: prepare-implementation
          effect: rework
        implementation-changes:
          to: implement
          effect: rework
        documentation-changes:
          to: document
          effect: rework
    - id: assess-goal
      use: goal-assessment
      evidence_from:
        - node: record-plan
          required: true
          items:
            - plan-summary
        - node: prepare-implementation
          required: true
          items:
            - implementation-entry-summary
        - node: implement
          required: true
          items:
            - implementation-summary
            - source-revision
        - node: verify
          required: true
          items:
            - verification-result
        - node: refine
          required: true
          items:
            - refinement-summary
        - node: document
          required: true
          items:
            - documentation-summary
        - node: review
          required: true
          items:
            - review-round
            - review-mode
            - review-run-id
            - review-summary
            - ci-decision
            - unresolved-valid-findings
            - unresolved-implementation-findings
            - unresolved-documentation-findings
      routes:
        achieved:
          to: record-outcome
          effect: advance
        not-achieved:
          to: record-outcome
          effect: advance
        superseded:
          to: record-outcome
          effect: advance
    - id: record-outcome
      use: outcome-record
      next: approve-closeout
    - id: approve-closeout
      use: approval-decision
      evidence_from:
        - node: assess-goal
          required: true
        - node: record-outcome
          required: true
          items:
            - outcome-summary
      routes:
        approved:
          to: closeout
          effect: advance
        changes-requested:
          to: refine
          effect: rework
    - id: closeout
      use: closeout-record
      terminal: true
manual_rework:
  allowed_targets:
    - implement
    - verify
    - refine
    - document
    - review
